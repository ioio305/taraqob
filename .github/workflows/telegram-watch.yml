# ── مراقب تليجرام — نبضة كل 5 دقائق أثناء جلسة نيويورك ─────────────────────
# حساب Vercel الحالي (Hobby) يسمح بمهام مجدولة يومية فقط، لذلك تتولى
# GitHub Actions النداء كل 5 دقائق (13:00–21:59 UTC = ساعات جلسة نيويورك
# صيفاً وشتاءً) والمسار نفسه يتحقق من توقيت نيويورك بدقة ويخرج مبكراً
# خارج الجلسة. السر يُقرأ من أسرار المستودع (CRON_SECRET) ولا يُكتب هنا.
name: telegram-watch

on:
  schedule:
    - cron: "*/5 13-21 * * 1-5"
  workflow_dispatch:   # تشغيل يدوي من تبويب Actions عند الحاجة

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    concurrency:
      group: telegram-watch-live
      cancel-in-progress: true
    steps:
      - name: متابعة مستمرة أثناء الجلسة
        run: |
          for i in $(seq 1 18); do
            started=$(date +%s)
            code=$(curl -sS -o /tmp/tw.json -w "%{http_code}" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              "https://trqob.com/api/v2/telegram-watch")
            echo "pulse=$i http=$code"
            cat /tmp/tw.json
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              exit 1
            fi
            elapsed=$(($(date +%s) - started))
            remaining=$((15 - elapsed))
            if [ "$i" -lt 18 ] && [ "$remaining" -gt 0 ]; then sleep "$remaining"; fi
          done
